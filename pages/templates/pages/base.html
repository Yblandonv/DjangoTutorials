{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link href="{% static 'css/app.css' %}" rel="stylesheet" />
    <title>{% block title %}Online Store{% endblock %}</title>
  </head>

  <body>
    <!-- header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary py-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Online Store</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="{% url 'home' %}">Home</a>
            <a class="nav-link active" href="{% url 'about' %}">About</a>
            <a class="nav-link active" href="{% url 'index' %}">Products</a>
            <a class="nav-link active" href="{% url 'form' %}">Create Product</a>

          </div>
        </div>
      </div>
    </nav>

    <header class="masthead bg-primary text-white text-center py-4">
      <div class="container d-flex align-items-center flex-column">
        <h2>{% block header_title %}A Laravel EAFIT App{% endblock %}</h2>
      </div>
    </header>
    <!-- end header -->

    <div class="container my-4">
      {% block content %}
      {% endblock %}
    </div>

    <!-- footer -->
    <footer class="bg-dark text-white py-4 text-center">
      <div class="container">
        <small>
          &copy; {% block footer %}
          <a
            class="text-reset fw-bold text-decoration-none"
            target="_blank"
            href="https://twitter.com/danielgarcar"
          >
            Daniel Correa
          </a>
          {% endblock %}
        </small>
      </div>
    </footer>
    <!-- end footer -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
